<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chalet 222®</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        header, footer {
            background-color: #333;
            color: white;
            padding: 1em 0;
        }
        header {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        footer {
            text-align: center;
            background-color: rgba(34, 85, 34, 0.10);
            color: #bdbdbd;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
        }
        main {
            width: min(1200px, 94vw);
            margin: 2rem auto;
            padding: 0 1rem;
        }
        nav ul {
            list-style-type: none;
            padding: 0;
            text-align: center;
        }
        nav ul li {
            display: inline;
            margin-right: 10px;
        }
        a {
            text-decoration: none;
            color: #f9e2f9;
        }
        footer nav a {
            color: #bdbdbd;
        }
        /* Category sections */
        .category {
            margin-top: 2.5rem;
        }
        .category-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.25rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }
        .category-header h2 {
            margin: 0;
            font-size: 1.35rem;
            color: #f4f4f4;
            letter-spacing: 0.02em;
        }
        .category-header .count {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.45);
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 0.15rem 0.55rem;
        }
        /* Product grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
        }
        .product-card {
            display: block;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
        }
        .product-card img {
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            display: block;
        }
        .product-card-placeholder {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 2.5rem;
        }
        .product-card-body {
            padding: 0.85rem 1rem 1rem;
        }
        .product-card-body h3 {
            margin: 0 0 0.2rem;
            font-size: 1.05rem;
            color: #f4f4f4;
            text-transform: capitalize;
        }
        .product-card-body p {
            margin: 0;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.55);
        }
    </style>
</head>
<body>

     <header class="site-header">
        <a href="index.html" class="logo-link">
            <img src="images/chalet222.png" alt="chalet 222 logo" class="logo-img" width="200" height="65">
        </a>
        <nav>
        <ul>
           <li><a href="decor.html" aria-current="page">222 Dêcor</a></li>
            <li><a href="custom-paintings.html">Paintings by Ashley</a></li>
            <li class="nav-dropdown"><a href="glass-metal.html">Beautifully Broken®</a><ul class="dropdown-menu"><li><a href="glass-metal.html#tree-of-life">Tree of Life</a></li></ul></li>
        </ul>
        </nav>
        <a href="sign-in.html" class="header-signin">Sign In</a>
    </header>

    <main>
        <h1>222 Dêcor</h1>

        <div class="product-grid">

            <a class="product-card" href="222-decor-shower-curtain-original.html">
                <img src="images/222-Decor/shower-curtain/original/Chalet222-shower-curtain-original-og.jpg" alt="Shower Curtains">
                <div class="product-card-body">
                    <h3>Shower Curtains</h3>
                </div>
            </a>

            <a class="product-card" href="222-decor-pillows.html">
                <img src="images/222-Decor/pillows/peaceful-buddha/Chalet222-peacefull-buddha-pillow-12x12.jpg" alt="Pillows">
                <div class="product-card-body">
                    <h3>Pillows</h3>
                </div>
            </a>

        </div>
    </main>

    <footer>
        <nav>
        <ul>
            <li><a href="about-us.html">Origin</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        </nav>
        <p>©2026 All rights reserved. If you are using a screen reader and are having problems using this website, please call (248) 123-4567 for assistance.</p>
    </footer>

</body>
</html>
