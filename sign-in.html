<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chalet 222®</title>
    <link rel="stylesheet" href="style.css">

    <style>
        /* Basic CSS for the layout can go here */
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header, footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 1em 0;
        }
        footer {
            background-color: rgba(0, 0, 0, 0.35);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
        }
        main {
            padding: 2em;
            max-width: 800px;
            margin: 0 auto 2rem;
            flex: 1;
        }
        nav ul {
            list-style-type: none;
            padding: 0;
        }
        nav ul li {
            display: inline;
            margin-right: 10px;
        }
        a {
            text-decoration: none;
            color: #f9e2f9;
        }
        footer nav a {
            color: lightgray;
        }
        .signin-form {
            max-width: 640px;
            width: 100%;
            margin: 0 auto 1em;
            color: #fff;
        }
        .signin-form h2 {
            margin-top: 0;
            text-align: left;
            position: relative;
            left: -110px;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        }
        .signin-form > div,
        .signin-form button[type="submit"] {
            position: relative;
            left: -110px;
        }
        .signin-form label {
            display: block;
            margin-bottom: 0.5em;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        }
        .signin-form input {
            width: 100%;
            padding: 0.6em;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1em;
        }
        .signin-form button[type="submit"] {
            width: 100%;
            padding: 0.7em;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 0.5em;
        }
        .signin-form button[type="submit"]:hover {
            background-color: #555;
        }
        @media (max-width: 900px) {
            .signin-form h2 {
                left: 0;
            }
            .signin-form > div,
            .signin-form button[type="submit"] {
                left: 0;
            }
        }
    </style>
</head>
<body>

     <header class="site-header">
        <a href="index.html" class="logo-link">
            <img src="images/chalet222.png" alt="chalet 222 logo" class="logo-img" width="200" height="65">
        </a>
        <nav>
        <ul>
             <li><a href="decor.html">222 Dêcor</a></li>
            <li><a href="custom-paintings.html">Paintings by Ashley</a></li>
            <li><a href="glass-metal.html">Beautifully Broken®</a></li>

        </ul>
        </nav>
        <a href="sign-in.html" class="header-signin" aria-current="page">Sign In</a>
    </header>

    <main>
        
        <form action="#" method="post" class="signin-form">
            <h2>Sign In</h2>
            <div style="margin-bottom: 1em;">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div style="margin-bottom: 1em;">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Login</button>
        </form>
        
    </main>

    <footer>
        <nav>
        <ul>
            <li><a href="about-us.html">About Us</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        </nav>
        <p>&copy;2026 Chalet 222®</p>
    </footer>

    <script>
        let currentSlide = 1;
        const totalSlides = 3;

        function changeSlide(direction) {
            currentSlide += direction;
            if (currentSlide < 1) currentSlide = totalSlides;
            if (currentSlide > totalSlides) currentSlide = 1;
            document.getElementById('slide' + currentSlide).checked = true;
        }
    </script>

</body>
</html>
