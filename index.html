<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chalet 222®</title>
    <link rel="stylesheet" href="style.css">

    <style>
        /* Basic CSS for the layout can go here */
        main {
            max-width: 1400px;
            margin-bottom: 2rem;
        }

        .product-grid .grid-container {
            display: flex;
            flex-wrap: nowrap;
            justify-content: center;
            align-items: flex-start;
            gap: 8px;
            width: 100%;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .product-grid .product {
            flex: 0 1 270px;
            min-width: 0;
            max-width: 270px;
            box-sizing: border-box;
            text-align: center;
        }

        .product-grid .product img {
            width: 100%;
            aspect-ratio: 1 / 1;
            height: auto;
            object-fit: cover;
            display: block;
            border-radius: 4px;
        }

        @media (max-width: 1200px) {
            .product-grid .grid-container {
                flex-wrap: wrap;
            }

            .product-grid .product {
                flex-basis: 270px;
                max-width: 270px;
            }
        }

        @media (max-width: 768px) {
            .product-grid .grid-container {
                flex-wrap: wrap;
            }

            .product-grid .product {
                flex: 1 1 calc(50% - 20px);
                max-width: 220px;
            }
        }

        @media (max-width: 480px) {
            .product-grid .product {
                flex-basis: 100%;
                max-width: 240px;
            }
        }
    </style>
</head>
<body>

     <header class="site-header">
        <a href="index.html" class="logo-link">
            <img src="/images/chalet222.png" alt="chalet 222 logo" class="logo-img" width="200" height="65">
        </a>
        <nav>
        <ul>
           <li><a href="decor.html">222 | Dêcor</a></li>
            <li><a href="custom-paintings.html">Paintings by Ashley</a></li>
            <li><a href="glass-metal.html">Beautifully Broken®</a></li>
        </ul>
        </nav>
        <a href="sign-in.html" class="header-signin">Sign In</a>
    </header>

    <main>
        
        <section class="product-grid">
            <div class="grid-container">
                 <div class="product">
                    <img src="https://via.placeholder.com/300x200?text=Product+3" alt="Product 3">
                    <h4>Dêcor</h4>
                </div>
                <div class="product">
                    <img src="https://via.placeholder.com/300x200?text=Product+2" alt="Product 2">
                    <h4>Paintings</h4>
                </div>
                <div class="product">
                    <img src="https://via.placeholder.com/300x200?text=Product+1" alt="Product 1">
                    <h4>Glass & Metal</h4>
                </div>
                <div class="product">
                    <img src="https://via.placeholder.com/300x300?text=Product+4" alt="Product 4">
                    <h4>Collections</h4>
                </div>
                <div class="product">
                    <img src="https://via.placeholder.com/300x300?text=Product+5" alt="Product 5">
                    <h4>Featured</h4>
                </div>
            </div>
        </section>
        
    </main>

    <footer>
        <nav>
        <ul>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        </nav>
        <p>&copy; 2026 Chalet 222®</p>
    </footer>

</body>
</html>
